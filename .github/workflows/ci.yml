name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      resume_orbits:
        description: 排查上游异常后恢复轨道检查（仍遵守两小时冷却）
        type: boolean
        default: false
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: 测试与构建 (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.18.0", "24"]

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 配置 Node.js 与 npm 缓存
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装锁定的依赖
        run: npm ci

      - name: 恢复上次轨道检查与有效快照
        if: matrix.node-version == '24' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/station-feed.json
          key: stations-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stations-v1-

      - name: 检查空间站轨道（上游最短间隔两小时）
        if: matrix.node-version == '24' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        run: node --experimental-strip-types scripts/update-stations.mjs ${{ inputs.resume_orbits && '--resume' || '' }}

      - name: 保存轨道检查记录（含失败与中断）
        if: always() && matrix.node-version == '24' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/station-feed.json
          key: stations-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 运行全部测试
        run: npm test

      - name: 检查类型并构建
        run: npm run build -- --base "/${GITHUB_REPOSITORY#*/}/"

      - name: 上传 Pages 构建产物
        if: matrix.node-version == '24' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: 发布 GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 配置 Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: 发布静态站点
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
